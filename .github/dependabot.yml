version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    ignore:
      # typescript-eslint doesn't support TS 7.0 yet (confirmed 2026-07-28:
      # `typescript-eslint does not support TS 7.0`, tracked at
      # https://github.com/typescript-eslint/typescript-eslint/issues/10940).
      # Remove this ignore once that issue closes.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      next-ecosystem:
        patterns:
          - "next"
          - "eslint-config-next"
          - "@next/*"
      dev-dependencies:
        dependency-type: "development"
    commit-message:
      prefix: "chore"
      include: "scope"
    target-branch: "development"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore"
      include: "scope"
    target-branch: "development"
