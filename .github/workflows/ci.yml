name: CI

on:
  pull_request:
  push:
    branches: ["development", "main"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Security audit
        # 2 high-severity advisories are ignored via pnpm-workspace.yaml's
        # auditConfig.ignoreGhsas (GHSA-f88m-g3jw-g9cj, GHSA-mh99-v99m-4gvg)
        # — see specification.md for the risk-acceptance rationale on each.
        run: pnpm audit --audit-level=high

      - name: Build
        run: pnpm build
